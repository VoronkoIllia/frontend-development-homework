<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/auth-style.css" />
    <title>Log In</title>
  </head>
  <body>
    <main>
      <form>
        <h2>Авторизація</h2>
        <div class="form-field">
          <label for="username">Нікнейм: </label>
          <input
            type="text"
            id="username"
            name="username"
            required
            aria-required="true"
          /><br /><br />
        </div>

        <div class="form-field">
          <label for="password">Пароль:</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            aria-required="true"
          />
        </div>

        <div class="button-group">
          <button type="submit">Log In</button>
          <button type="reset">Reset</button>
        </div>
      </form>
    </main>
  </body>
</html>
